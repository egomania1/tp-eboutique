<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <!-- USB body -->
  <rect x="160" y="160" width="220" height="80" rx="12" fill="#cc0000" stroke="#990000" stroke-width="2"/>
  <!-- shine -->
  <rect x="165" y="163" width="210" height="20" rx="8" fill="rgba(255,255,255,0.08)"/>
  <!-- Kingston logo area -->
  <rect x="175" y="175" width="80" height="30" rx="4" fill="#a80000"/>
  <text x="215" y="194" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">KINGSTON</text>
  <!-- DataTraveler label -->
  <text x="310" y="188" font-family="Arial" font-size="10" fill="#ffdddd" text-anchor="middle">DataTraveler</text>
  <text x="310" y="202" font-family="Arial" font-size="10" fill="#ffdddd" text-anchor="middle">64 Go</text>
  <!-- USB connector -->
  <rect x="380" y="176" width="80" height="48" rx="4" fill="#bbb" stroke="#999" stroke-width="1.5"/>
  <rect x="388" y="183" width="64" height="34" rx="2" fill="#444"/>
  <!-- USB contacts -->
  <rect x="395" y="187" width="50" height="6" rx="1" fill="#888"/>
  <rect x="395" y="199" width="50" height="6" rx="1" fill="#888"/>
  <rect x="395" y="211" width="50" height="6" rx="1" fill="#888"/>
  <!-- cap end -->
  <rect x="155" y="165" width="18" height="70" rx="8" fill="#aa0000" stroke="#880000" stroke-width="1"/>
  <!-- label -->
  <text x="300" y="310" font-family="Arial, sans-serif" font-size="20" fill="#c8ff00" text-anchor="middle" font-weight="bold">Clé USB Kingston 64 Go</text>
  <text x="300" y="334" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">DataTraveler — USB 3.2</text>
</svg>
