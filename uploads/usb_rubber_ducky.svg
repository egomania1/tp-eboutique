<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <!-- USB body -->
  <rect x="220" y="140" width="160" height="90" rx="10" fill="#f5d020" stroke="#d4aa00" stroke-width="2"/>
  <!-- USB connector -->
  <rect x="340" y="163" width="80" height="44" rx="4" fill="#aaa" stroke="#888" stroke-width="1.5"/>
  <rect x="348" y="171" width="64" height="28" rx="2" fill="#444"/>
  <!-- rubber duck silhouette on body -->
  <ellipse cx="275" cy="185" rx="28" ry="22" fill="#f0c000"/>
  <circle cx="275" cy="162" r="14" fill="#f0c000"/>
  <ellipse cx="285" cy="157" rx="8" ry="5" fill="#ff8c00"/>
  <circle cx="280" cy="160" r="2.5" fill="#111"/>
  <!-- "DUCKY" text -->
  <text x="275" y="200" font-family="monospace" font-size="9" fill="#111" text-anchor="middle" font-weight="bold">RUBBER</text>
  <text x="275" y="212" font-family="monospace" font-size="9" fill="#111" text-anchor="middle" font-weight="bold">DUCKY</text>
  <!-- USB symbol on connector -->
  <text x="380" y="189" font-family="Arial" font-size="16" fill="#c8ff00" text-anchor="middle">⚡</text>
  <!-- label -->
  <text x="300" y="310" font-family="Arial, sans-serif" font-size="20" fill="#c8ff00" text-anchor="middle" font-weight="bold">USB Rubber Ducky</text>
  <text x="300" y="334" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">HID Attack Tool — Hak5</text>
</svg>
