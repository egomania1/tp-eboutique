<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <!-- Keyboard body shadow -->
  <rect x="65" y="125" width="470" height="195" rx="18" fill="#080808" opacity="0.6"/>
  <!-- Keyboard body -->
  <rect x="60" y="108" width="480" height="195" rx="16" fill="#1a1a1c" stroke="#2e2e32" stroke-width="1.5"/>
  <rect x="68" y="116" width="464" height="179" rx="12" fill="#222226"/>

  <!-- Row 1: Fn keys -->
  <g fill="#242428" stroke="#36363c" stroke-width="0.6">
    <rect x="78" y="124" width="26" height="18" rx="4"/>
    <rect x="108" y="124" width="26" height="18" rx="4"/>
    <rect x="138" y="124" width="26" height="18" rx="4"/>
    <rect x="168" y="124" width="26" height="18" rx="4"/>
    <rect x="204" y="124" width="26" height="18" rx="4"/>
    <rect x="234" y="124" width="26" height="18" rx="4"/>
    <rect x="264" y="124" width="26" height="18" rx="4"/>
    <rect x="294" y="124" width="26" height="18" rx="4"/>
    <rect x="330" y="124" width="26" height="18" rx="4"/>
    <rect x="360" y="124" width="26" height="18" rx="4"/>
    <rect x="390" y="124" width="26" height="18" rx="4"/>
    <rect x="420" y="124" width="26" height="18" rx="4"/>
    <rect x="450" y="124" width="26" height="18" rx="4"/>
    <rect x="484" y="124" width="26" height="18" rx="4"/>
  </g>
  <!-- emoji key accent -->
  <rect x="484" y="124" width="26" height="18" rx="4" fill="#c8ff00" stroke="#a0cc00" stroke-width="0.6"/>
  <text x="497" y="136" font-family="Arial" font-size="9" fill="#000" text-anchor="middle">⚙</text>

  <!-- Row 2: Numbers -->
  <g fill="#242428" stroke="#36363c" stroke-width="0.6">
    <rect x="78" y="148" width="26" height="22" rx="4"/>
    <rect x="108" y="148" width="26" height="22" rx="4"/>
    <rect x="138" y="148" width="26" height="22" rx="4"/>
    <rect x="168" y="148" width="26" height="22" rx="4"/>
    <rect x="198" y="148" width="26" height="22" rx="4"/>
    <rect x="228" y="148" width="26" height="22" rx="4"/>
    <rect x="258" y="148" width="26" height="22" rx="4"/>
    <rect x="288" y="148" width="26" height="22" rx="4"/>
    <rect x="318" y="148" width="26" height="22" rx="4"/>
    <rect x="348" y="148" width="26" height="22" rx="4"/>
    <rect x="378" y="148" width="26" height="22" rx="4"/>
    <rect x="408" y="148" width="26" height="22" rx="4"/>
    <rect x="438" y="148" width="26" height="22" rx="4"/>
    <rect x="468" y="148" width="42" height="22" rx="4"/>
  </g>

  <!-- Row 3: QWERTY -->
  <g fill="#242428" stroke="#36363c" stroke-width="0.6">
    <rect x="78" y="176" width="40" height="22" rx="4"/>
    <rect x="122" y="176" width="26" height="22" rx="4"/>
    <rect x="152" y="176" width="26" height="22" rx="4"/>
    <rect x="182" y="176" width="26" height="22" rx="4"/>
    <rect x="212" y="176" width="26" height="22" rx="4"/>
    <rect x="242" y="176" width="26" height="22" rx="4"/>
    <rect x="272" y="176" width="26" height="22" rx="4"/>
    <rect x="302" y="176" width="26" height="22" rx="4"/>
    <rect x="332" y="176" width="26" height="22" rx="4"/>
    <rect x="362" y="176" width="26" height="22" rx="4"/>
    <rect x="392" y="176" width="26" height="22" rx="4"/>
    <rect x="422" y="176" width="26" height="22" rx="4"/>
    <rect x="452" y="176" width="58" height="22" rx="4"/>
  </g>

  <!-- Row 4: ASDF (Caps Lock) -->
  <g fill="#242428" stroke="#36363c" stroke-width="0.6">
    <rect x="78" y="204" width="50" height="22" rx="4"/>
    <rect x="132" y="204" width="26" height="22" rx="4"/>
    <rect x="162" y="204" width="26" height="22" rx="4"/>
    <rect x="192" y="204" width="26" height="22" rx="4"/>
    <rect x="222" y="204" width="26" height="22" rx="4"/>
    <rect x="252" y="204" width="26" height="22" rx="4"/>
    <rect x="282" y="204" width="26" height="22" rx="4"/>
    <rect x="312" y="204" width="26" height="22" rx="4"/>
    <rect x="342" y="204" width="26" height="22" rx="4"/>
    <rect x="372" y="204" width="26" height="22" rx="4"/>
    <rect x="402" y="204" width="26" height="22" rx="4"/>
    <rect x="432" y="204" width="78" height="22" rx="4"/>
  </g>
  <!-- Enter accent -->
  <rect x="432" y="204" width="78" height="22" rx="4" fill="#2a2a30" stroke="#c8ff00" stroke-width="0.8"/>
  <text x="471" y="219" font-family="Arial" font-size="9" fill="#c8ff00" text-anchor="middle">↵</text>

  <!-- Row 5: ZXCV + Space -->
  <g fill="#242428" stroke="#36363c" stroke-width="0.6">
    <rect x="78" y="232" width="64" height="22" rx="4"/>
    <rect x="146" y="232" width="26" height="22" rx="4"/>
    <rect x="176" y="232" width="26" height="22" rx="4"/>
    <rect x="206" y="232" width="26" height="22" rx="4"/>
    <rect x="236" y="232" width="26" height="22" rx="4"/>
    <rect x="266" y="232" width="26" height="22" rx="4"/>
    <rect x="296" y="232" width="26" height="22" rx="4"/>
    <rect x="326" y="232" width="26" height="22" rx="4"/>
    <rect x="356" y="232" width="26" height="22" rx="4"/>
    <rect x="386" y="232" width="26" height="22" rx="4"/>
    <rect x="416" y="232" width="94" height="22" rx="4"/>
  </g>

  <!-- Spacebar row -->
  <g fill="#242428" stroke="#36363c" stroke-width="0.6">
    <rect x="78" y="260" width="32" height="22" rx="4"/>
    <rect x="114" y="260" width="32" height="22" rx="4"/>
    <rect x="150" y="260" width="32" height="22" rx="4"/>
    <rect x="186" y="260" width="170" height="22" rx="4"/>
    <rect x="360" y="260" width="32" height="22" rx="4"/>
    <rect x="396" y="260" width="32" height="22" rx="4"/>
    <rect x="432" y="260" width="32" height="22" rx="4"/>
    <rect x="468" y="260" width="42" height="22" rx="4"/>
  </g>
  <!-- Space bar subtle glow -->
  <rect x="186" y="260" width="170" height="22" rx="4" fill="#252529" stroke="#3a3a40" stroke-width="0.8"/>
  <!-- Logitech center dot -->
  <circle cx="271" cy="271" r="3.5" fill="#c8ff00" opacity="0.85"/>

  <!-- Labels -->
  <text x="300" y="348" font-family="Arial, sans-serif" font-size="20" fill="#c8ff00" text-anchor="middle" font-weight="bold">Logitech MX Keys</text>
  <text x="300" y="372" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">Advanced Wireless Keyboard</text>
</svg>
