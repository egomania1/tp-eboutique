<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <!-- Mouse body shadow -->
  <ellipse cx="302" cy="212" rx="110" ry="80" fill="#050505" opacity="0.7"/>
  <!-- Mouse body -->
  <path d="M200 200 Q200 120 300 110 Q400 120 400 200 Q400 280 300 290 Q200 280 200 200Z" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Left/right button split line -->
  <line x1="300" y1="110" x2="300" y2="230" stroke="#333" stroke-width="1.5"/>
  <!-- Scroll wheel -->
  <rect x="284" y="140" width="32" height="50" rx="10" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <rect x="286" y="142" width="28" height="46" rx="9" fill="#111"/>
  <line x1="284" y1="152" x2="316" y2="152" stroke="#444" stroke-width="0.8"/>
  <line x1="284" y1="160" x2="316" y2="160" stroke="#444" stroke-width="0.8"/>
  <line x1="284" y1="168" x2="316" y2="168" stroke="#444" stroke-width="0.8"/>
  <line x1="284" y1="176" x2="316" y2="176" stroke="#444" stroke-width="0.8"/>
  <!-- RGB strip -->
  <path d="M230 230 Q300 250 370 230" stroke="#c8ff00" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M230 230 Q300 250 370 230" stroke="#c8ff00" stroke-width="6" fill="none" opacity="0.15"/>
  <!-- Side buttons -->
  <rect x="195" y="190" width="12" height="18" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <rect x="195" y="212" width="12" height="18" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <!-- Logitech G logo -->
  <circle cx="300" cy="200" r="16" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="300" y="205" font-family="Arial Black, sans-serif" font-size="14" fill="#c8ff00" text-anchor="middle" font-weight="900">G</text>
  <!-- DPI button -->
  <rect x="280" y="198" width="18" height="7" rx="2" fill="#222" stroke="#444" stroke-width="0.8"/>
  <text x="289" y="204" font-family="monospace" font-size="5" fill="#888" text-anchor="middle">DPI</text>
  <!-- label -->
  <text x="300" y="330" font-family="Arial, sans-serif" font-size="20" fill="#c8ff00" text-anchor="middle" font-weight="bold">Souris Logitech G502</text>
  <text x="300" y="354" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">Hero 25K — Gaming Mouse</text>
</svg>
