<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <!-- Mount arm -->
  <rect x="283" y="280" width="34" height="60" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="260" y="330" width="80" height="12" rx="4" fill="#222" stroke="#333" stroke-width="1"/>
  <!-- Arm joint -->
  <circle cx="300" cy="280" r="12" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/>
  <circle cx="300" cy="280" r="5" fill="#111"/>

  <!-- Camera body -->
  <ellipse cx="300" cy="210" rx="70" ry="55" fill="#1c1c1e" stroke="#2e2e32" stroke-width="2"/>
  <!-- Body highlight -->
  <ellipse cx="300" cy="190" rx="60" ry="25" fill="rgba(255,255,255,0.04)"/>

  <!-- Lens barrel -->
  <circle cx="300" cy="210" r="42" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="210" r="36" fill="#0a0a0a" stroke="#222" stroke-width="1.5"/>
  <circle cx="300" cy="210" r="28" fill="#050505" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Lens glass -->
  <circle cx="300" cy="210" r="20" fill="#0d1a2a"/>
  <circle cx="300" cy="210" r="18" fill="#0a1520"/>
  <!-- Lens reflection -->
  <ellipse cx="293" cy="203" rx="7" ry="5" fill="rgba(100,180,255,0.15)" transform="rotate(-20 293 203)"/>
  <circle cx="307" cy="216" r="3" fill="rgba(100,180,255,0.08)"/>
  <!-- Lens center dot -->
  <circle cx="300" cy="210" r="4" fill="#1a2a3a"/>

  <!-- IR LEDs ring -->
  <circle cx="258" cy="180" r="4" fill="#222" stroke="#c8ff00" stroke-width="1"/>
  <circle cx="342" cy="180" r="4" fill="#222" stroke="#c8ff00" stroke-width="1"/>
  <circle cx="258" cy="240" r="4" fill="#222" stroke="#c8ff00" stroke-width="1"/>
  <circle cx="342" cy="240" r="4" fill="#222" stroke="#c8ff00" stroke-width="1"/>
  <circle cx="248" cy="210" r="4" fill="#222" stroke="#c8ff00" stroke-width="1"/>
  <circle cx="352" cy="210" r="4" fill="#222" stroke="#c8ff00" stroke-width="1"/>

  <!-- Status LED -->
  <circle cx="330" cy="165" r="4" fill="#00ff00" opacity="0.85"/>
  <!-- Foscam label on body -->
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">FOSCAM</text>

  <!-- label -->
  <text x="300" y="368" font-family="Arial, sans-serif" font-size="20" fill="#c8ff00" text-anchor="middle" font-weight="bold">Caméra IP Foscam</text>
  <text x="300" y="390" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">HD 1080p — Vision nocturne IR</text>
</svg>
